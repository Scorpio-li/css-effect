<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连续排列所有数字,并实现它们的位置</title>
    <style>
        .counter {
            width: 100px;
            font: 800 40px system-ui;
            overflow: hidden;
        }
        .numbers {
            width: auto;
            display: flex;
            animation: countNumber 4s infinite alternate;
            animation-timing-function: steps(10);
        }
        .numbers div {
            text-align: center;
            flex: 0 0 100px;
            }

            @keyframes countNumber {
            0% {
                margin-left: 0px;
            }
            100% {
                margin-left: -1000px;
            }
            }
    </style>
</head>
<body>
    

<div class="counter">
    <div class="numbers">
      <div>0</div>
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
    </div>
  </div>
  
  
</body>
</html>
